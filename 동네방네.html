<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네방네 — 내 동네, 내 관심사에 맞는 오픈채팅</title>
<style>
/* ==========================================================================
   동네방네 — 한 파일로 돌아가는 판(서버 없이 열림)

   색·크기를 여기 모아두었습니다. 색을 바꾸려면 아래 :root 값만 고치면
   화면 전체가 한 번에 바뀝니다.
   ========================================================================== */

:root {
  --scale: 1;

  --bg: #f6f8f7;
  --surface: #ffffff;
  --surface-2: #eef1f0;
  --border: #e0e5e3;
  --border-strong: #c8d0cd;

  --text: #16211f;
  --text-muted: #566661;
  --text-faint: #84918d;

  --primary: #0d6e6e;
  --primary-hover: #0a5a5a;
  --primary-soft: #e2f2f2;
  --primary-text: #ffffff;

  --accent: #c2621a;
  --accent-soft: #fdf1e5;

  --success: #1c7a52;
  --success-soft: #e6f5ee;

  --warn: #9a6a05;
  --warn-soft: #fdf5e2;

  --danger: #b3261e;
  --danger-soft: #fdeceb;

  --radius: 14px;
  --radius-sm: 9px;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow: 0 2px 8px rgba(16, 24, 40, 0.07);

  --maxw: 720px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101512;
    --surface: #171e1b;
    --surface-2: #1f2825;
    --border: #2a3431;
    --border-strong: #3a4643;

    --text: #e8efec;
    --text-muted: #a3b0ac;
    --text-faint: #7b8884;

    --primary: #4fc4c4;
    --primary-hover: #74d3d3;
    --primary-soft: #103030;
    --primary-text: #071717;

    --accent: #e8a15e;
    --accent-soft: #33240f;

    --success: #5fc99a;
    --success-soft: #10291f;

    --warn: #ddb04a;
    --warn-soft: #2b2413;

    --danger: #f08b83;
    --danger-soft: #331a18;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.45);

    color-scheme: dark;
  }
}

/* 크게 보기 */
html[data-textsize="large"] { --scale: 1.28; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  font-size: calc(16px * var(--scale));
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all; /* 한글 단어 중간에서 줄바꿈되지 않게 */
}

h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 2px;
  border-radius: 4px;
}

/* --- 레이아웃 ----------------------------------------------------------- */

.shell { min-height: 100dvh; display: flex; flex-direction: column; }

.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 20px;
}

.main { flex: 1; padding: 28px 0 64px; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.topbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 60px;
  padding-top: 8px;
  padding-bottom: 8px;
}

.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  color: var(--text);
  font-weight: 700;
  font-size: 1.15em;
  letter-spacing: -0.02em;
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
}

.brand__mark { color: var(--primary); }

.brand__tag {
  font-size: 0.72em;
  font-weight: 500;
  color: var(--text-faint);
  letter-spacing: 0;
}

.footer {
  border-top: 1px solid var(--border);
  padding: 22px 0 34px;
  color: var(--text-faint);
  font-size: 0.82em;
  line-height: 1.7;
}

/* --- 공통 조각 ---------------------------------------------------------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 20px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font-weight: 600;
  font-size: 1em;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}

.btn:hover { background: var(--border); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--primary); color: var(--primary-text); }
.btn--primary:hover { background: var(--primary-hover); }

.btn--ghost {
  background: transparent;
  border-color: var(--border-strong);
  color: var(--text-muted);
}

.btn--ghost:hover { background: var(--surface-2); color: var(--text); }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.76em;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}

.badge--primary { background: var(--primary-soft); color: var(--primary); }
.badge--accent  { background: var(--accent-soft);  color: var(--accent); }
.badge--success { background: var(--success-soft); color: var(--success); }
.badge--warn    { background: var(--warn-soft);    color: var(--warn); }
.badge--muted   { background: var(--surface-2);    color: var(--text-muted); }

.textsize-toggle { padding: 8px 13px; font-size: 0.84em; flex-shrink: 0; }
.textsize-toggle__icon { font-weight: 800; font-size: 1.12em; line-height: 1; }

@media (max-width: 420px) {
  .textsize-toggle__label { display: none; }
}

.notice {
  padding: 13px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 0.86em;
  line-height: 1.6;
}

.notice--warn {
  background: var(--warn-soft);
  border-color: var(--warn);
  color: var(--warn);
}

/* --- 홈 ----------------------------------------------------------------- */

.hero { margin-bottom: 30px; }

.hero__eyebrow {
  color: var(--primary);
  font-size: 0.84em;
  font-weight: 700;
  margin-bottom: 8px;
}

.hero__title {
  font-size: 1.95em;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.28;
  margin-bottom: 12px;
}

.hero__lead { color: var(--text-muted); font-size: 0.97em; }

.section-title {
  font-size: 1.08em;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
}

.cta { display: grid; gap: 9px; margin: 22px 0 34px; }

.why { margin-bottom: 44px; }

.fact-list { display: grid; gap: 10px; }

.fact {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 15px 17px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.fact__num {
  flex-shrink: 0;
  width: 4.2em;
  color: var(--primary);
  font-size: 1.02em;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.fact__body { color: var(--text-muted); font-size: 0.9em; }

.steps { display: grid; gap: 10px; }

.step {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 15px 17px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.step__num {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.8em;
  height: 1.8em;
  border-radius: 999px;
  background: var(--primary);
  color: var(--primary-text);
  font-size: 0.9em;
  font-weight: 800;
}

.step__body { color: var(--text-muted); font-size: 0.93em; }
.step__body strong { color: var(--text); }

.scope { margin-bottom: 44px; }

.scope__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.scope__col {
  padding: 17px 19px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.scope__head { font-weight: 700; font-size: 0.92em; margin-bottom: 9px; }
.scope__head--do { color: var(--success); }
.scope__head--dont { color: var(--danger); }

.scope__list { display: grid; gap: 6px; color: var(--text-muted); font-size: 0.88em; }

.scope__list li { padding-left: 1em; position: relative; }

.scope__list li::before {
  content: "·";
  position: absolute;
  left: 0.15em;
  font-weight: 800;
}

.safety { margin-bottom: 34px; }

.safety__list {
  display: grid;
  gap: 9px;
  padding: 17px 19px;
  background: var(--danger-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.9em;
  color: var(--text-muted);
}

.safety__list li { padding-left: 1.1em; position: relative; }

.safety__list li::before {
  content: "!";
  position: absolute;
  left: 0;
  color: var(--danger);
  font-weight: 800;
}

.safety__list strong { color: var(--text); }

/* --- 설문 --------------------------------------------------------------- */

.quiz { max-width: 560px; margin: 0 auto; }

.quiz__progress { margin-bottom: 16px; }

.quiz__progress-head {
  display: flex;
  justify-content: space-between;
  color: var(--text-faint);
  font-size: 0.8em;
  font-weight: 600;
  margin-bottom: 6px;
}

.quiz__bar {
  height: 6px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
}

.quiz__bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 999px;
  transition: width 0.25s;
}

.quiz__card { padding: 24px 22px; }

.quiz__title {
  font-size: 1.34em;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.38;
}

.quiz__why { margin-top: 7px; color: var(--text-muted); font-size: 0.88em; }

.quiz__multi-hint {
  margin-top: 10px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.82em;
  font-weight: 600;
}

.quiz__choices { display: grid; gap: 9px; margin-top: 22px; }

.choice {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding: 15px 18px;
  text-align: left;
  background: var(--surface-2);
  border: 1.5px solid transparent;
  border-radius: var(--radius-sm);
  transition: background 0.13s, border-color 0.13s;
}

.choice:hover { background: var(--primary-soft); border-color: var(--primary); }
.choice--on { background: var(--primary-soft); border-color: var(--primary); }
.choice__label { font-weight: 600; }

.choice__hint { color: var(--text-muted); font-size: 0.83em; font-weight: 400; }

.choice__mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.15em;
  height: 1.15em;
  margin-right: 7px;
  border: 1.5px solid var(--border-strong);
  border-radius: 5px;
  background: var(--surface);
  color: var(--primary);
  font-size: 0.8em;
  font-weight: 800;
  vertical-align: -0.15em;
}

.choice--on .choice__mark { border-color: var(--primary); background: var(--primary-soft); }
.choice:disabled { opacity: 0.45; cursor: not-allowed; }
.choice:disabled:hover { background: var(--surface-2); border-color: transparent; }

.quiz__actions { margin-top: 18px; }

.quiz__nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
}

.quiz__hint { color: var(--text-faint); font-size: 0.82em; }

/* --- 결과 --------------------------------------------------------------- */

.result-head { margin-bottom: 22px; }

.result-head__eyebrow { color: var(--text-faint); font-size: 0.84em; font-weight: 600; }

.result-head__title {
  margin-top: 6px;
  font-size: 1.72em;
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.34;
}

.result-head__title strong { color: var(--primary); }

.result-head__sum {
  margin-top: 12px;
  padding: 13px 16px;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  font-size: 0.94em;
}

.result-head__sum span {
  display: block;
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 0.86em;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

.chip {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.78em;
}

.chip--reason {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}

.result-head__actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }

.chat-list { display: grid; gap: 12px; }

.chatcard { padding: 19px 20px; }

.chatcard__top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }

.chatcard__members {
  margin-left: auto;
  color: var(--text-faint);
  font-size: 0.8em;
  font-weight: 600;
}

.chatcard__name {
  margin-top: 11px;
  font-size: 1.14em;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.4;
}

.chatcard__summary { margin-top: 4px; font-size: 0.94em; font-weight: 600; }
.chatcard__plain { margin-top: 8px; color: var(--text-muted); font-size: 0.9em; }

.chatcard__reasons {
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid var(--border);
}

.chatcard__reasons-label { color: var(--text-faint); font-size: 0.76em; font-weight: 700; }
.chatcard__reasons .chips { margin-top: 6px; }

.chatcard__foot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 14px;
}

.chatcard__keyword {
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.84em;
}

.chatcard__howto { margin-top: 8px; color: var(--text-faint); font-size: 0.8em; }
.chatcard__fail { margin-top: 8px; color: var(--danger); font-size: 0.82em; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="container topbar__inner">
      <button type="button" class="brand" id="brandBtn">
        <span><span class="brand__mark">동네방네</span></span>
        <span class="brand__tag">내 동네, 내 관심사에 맞는 오픈채팅</span>
      </button>
      <button type="button" class="btn btn--ghost textsize-toggle" id="textSizeBtn" aria-pressed="false">
        <span aria-hidden="true" class="textsize-toggle__icon">가</span>
        <span class="textsize-toggle__label">글자 크게</span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <!-- 화면 세 개를 번갈아 보여줍니다 -->
      <div id="screen-home"></div>
      <div id="screen-survey" hidden></div>
      <div id="screen-result" hidden></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>
        동네방네는 오픈채팅방을 <strong>찾아주는 것까지만</strong> 합니다.
        방을 직접 운영하지 않고, 사람을 소개해 주지도 않습니다.
      </p>
      <p>
        방 안에서 일어나는 일에 대해서는 책임지지 않습니다.
        <strong>돈을 요구하거나 개인정보를 묻는 방은 바로 나오세요.</strong>
        답변한 내용은 이 파일 안에서만 계산되며 어디에도 전송되지 않습니다.
      </p>
      <p style="margin-top:10px">
        AX-TON 프로젝트 · 수록 정보 확인 날짜 2026-08-18 ·
        지금은 예시 데이터로 만든 시험판입니다
      </p>
    </div>
  </footer>

</div>

<script>
/* ==========================================================================
   1) 설문 문항 — 지금은 모두 예시입니다.
      실제 문항이 정해지면 이 부분만 고치면 됩니다.
      주의: 보기의 id는 아래 CHATS의 regions·interests 값과 짝이 맞아야 합니다.

      { id: "food", label: "요리 · 맛집" },
      { id: "travel", label: "여행 · 나들이" },

  },
  {
    id: "purpose",
    title: "모임에서 무엇을 하고 싶으신가요?",

    choices: [
      { id: "info", label: "정보를 얻고 싶어요", hint: "질문하고 답 듣는 방" },
      { id: "together", label: "같이 하고 싶어요", hint: "오프라인 모임도 있는 방" },

    ]
  },
  {
    id: "age",
    title: "나이대가 어떻게 되시나요?",

    choices: [
      { id: "20e", label: "20대 초반" },
      { id: "20l", label: "20대 후반" },
      { id: "30s", label: "30대" },
      { id: "40s", label: "40대 이상" },
      { id: "any", label: "나이는 상관없어요" }
    ]
  },

/* ==========================================================================
   3) 매칭 — AI가 아니라 겹치는 만큼 점수를 더하는 계산입니다.
      아래 WEIGHT 숫자만 고치면 결과 순서가 바뀝니다.
   ========================================================================== */

var WEIGHT = {
  sameRegion: 5,  // 사는 지역이 같을 때
  online: 2,      // 전국 온라인 방일 때
  interest: 4,    // 관심사 하나가 겹칠 때마다
  purpose: 3,     // 하고 싶은 것이 맞을 때
  age: 2,         // 나이대가 맞을 때
  mood: 2,        // 분위기가 맞을 때
  time: 1,        // 활동 시간이 맞을 때
  size: 1         // 인원 규모가 맞을 때
};

/** 문항 id로 문항 찾기 */
function findQuestion(id) {
  for (var i = 0; i < QUESTIONS.length; i++) {
    if (QUESTIONS[i].id === id) return QUESTIONS[i];
  }
  return null;
}

/** 보기 id로 화면에 보일 이름 찾기 */
function choiceLabel(questionId, choiceId) {
  var q = findQuestion(questionId);
  if (!q) return choiceId;
  for (var i = 0; i < q.choices.length; i++) {
    if (q.choices[i].id === choiceId) return q.choices[i].label;
  }
  return choiceId;
}

function firstPick(answers, questionId) {
  var picks = answers[questionId];
  return picks && picks.length > 0 ? picks[0] : undefined;
}

function has(list, value) { return list.indexOf(value) !== -1; }

/** 방 하나를 채점합니다. 지역이 아예 어긋나면 null(제외)입니다. */
function scoreChat(chat, answers) {
  var region = firstPick(answers, "region");
  var interests = answers["interest"] || [];
  var purpose = firstPick(answers, "purpose");
  var age = firstPick(answers, "age");
  var mood = firstPick(answers, "mood");
  var time = firstPick(answers, "time");
  var size = firstPick(answers, "size");

  var total = 0;
  var reasons = [];
  var isOnlineChat = has(chat.regions, "online");

  /* 지역 — 다른 지역의 오프라인 모임은 보여주지 않습니다.
     나갈 수 없는 모임을 추천하는 것은 도움이 아니라 실망만 남깁니다. */
  if (region === "online") {
    if (isOnlineChat) { total += WEIGHT.sameRegion; reasons.push("온라인 모임"); }
    else { total += 1; }
  } else if (region && has(chat.regions, region)) {
    total += WEIGHT.sameRegion;
    reasons.push(choiceLabel("region", region) + " 지역");
  } else if (isOnlineChat) {
    total += WEIGHT.online;
    reasons.push("전국 온라인");
  } else if (region) {
    return null;
  }

  /* 관심사 — 겹치는 개수만큼 점수가 올라갑니다 */
  var shared = [];
  for (var i = 0; i < interests.length; i++) {
    if (has(chat.interests, interests[i])) shared.push(interests[i]);
  }
  if (shared.length > 0) {
    total += WEIGHT.interest * shared.length;
    var names = [];
    for (var j = 0; j < shared.length; j++) names.push(choiceLabel("interest", shared[j]));
    reasons.push(names.join(" · "));
  }

  /* 하고 싶은 것 */
  if (purpose && has(chat.purposes, purpose)) {
    total += WEIGHT.purpose;
    reasons.push(choiceLabel("purpose", purpose));
  }

  /* 나이대 */
  if (age && age !== "any") {
    if (has(chat.ages, age)) {
      total += WEIGHT.age;
      reasons.push(choiceLabel("age", age) + " 많음");
    } else if (has(chat.ages, "any")) {
      total += 1;
    }
  } else if (age === "any") {
    total += 1;
  }

  /* 분위기 */
  if (mood && has(chat.moods, mood)) {
    total += WEIGHT.mood;
    reasons.push(choiceLabel("mood", mood));
  }

  /* 활동 시간 */
  if (time && (has(chat.times, time) || has(chat.times, "anytime"))) {
    total += WEIGHT.time;
  }

  /* 인원 규모 */
  if (size && (size === "anysize" || has(chat.sizes, size))) {
    total += WEIGHT.size;
  }

  if (total <= 0) return null;
  return { chat: chat, score: total, reasons: reasons };
}

/** 답변에 맞는 방만 골라 잘 맞는 순서로 돌려줍니다 */
function matchChats(answers) {
  var out = [];
  for (var i = 0; i < CHATS.length; i++) {
    var m = scoreChat(CHATS[i], answers);
    if (m) out.push(m);
  }
  out.sort(function (a, b) { return b.score - a.score; });
  return out;
}

/** 점수를 사람이 읽을 수 있는 말로 바꿉니다 */
function matchLevel(score) {
  if (score >= 14) return { label: "잘 맞아요", tone: "success" };
  if (score >= 8) return { label: "맞는 편이에요", tone: "primary" };
  return { label: "한번 볼 만해요", tone: "muted" };
}

/** 글자로 들어온 값을 그대로 화면에 넣어도 안전하게 만듭니다 */
function esc(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

      '<h1 class="hero__title">내 동네, 내 관심사에 맞는<br>오픈채팅만 골라 드립니다.</h1>' +
      '<p class="hero__lead">오픈채팅방은 이미 수만 개가 있습니다. 문제는 검색어를 뭐라고 넣어야 할지 모르겠고, 어렵게 들어가 봐도 나와 상관없는 이야기만 오간다는 것입니다. 동네방네는 그 사이를 좁혀 줍니다.</p>' +
      '<div class="cta"><button type="button" class="btn btn--primary btn--block" data-start>설문 시작하기</button></div>' +
    '</section>' +

    '<p class="notice notice--warn"><strong>지금은 예시 데이터로 만든 시험판입니다.</strong> 수록된 방 ' + chatCount + '개는 화면을 보여주기 위해 만든 예시이며 실제로 있는 방이 아닙니다. 그래서 입장 링크 대신 <strong>카카오톡 검색어</strong>를 알려드립니다. 설문 문항도 예시이며 곧 실제 문항으로 바뀝니다.</p>' +

    '<section class="why" style="margin-top:34px">' +
      '<h2 class="section-title">어떻게 찾아 주나요</h2>' +
      '<ol class="steps">' +
        '<li class="step"><span class="step__num">1</span><span class="step__body"><strong>설문에 답합니다.</strong> 사는 곳, 관심사, 원하는 분위기 등 ' + questionCount + '개 문항입니다. 이름과 연락처는 묻지 않습니다.</span></li>' +
        '<li class="step"><span class="step__num">2</span><span class="step__body"><strong>겹치는 만큼 점수를 매깁니다.</strong> 사는 곳이 같으면 크게, 관심사가 겹치면 겹친 개수만큼 점수가 올라갑니다.</span></li>' +
        '<li class="step"><span class="step__num">3</span><span class="step__body"><strong>잘 맞는 방부터 보여줍니다.</strong> 왜 추천했는지 이유를 카드마다 함께 적어 둡니다.</span></li>' +
      '</ol>' +
    '</section>' +

    '<section class="why">' +
      '<h2 class="section-title">왜 이 서비스가 필요한가</h2>' +
      '<ul class="fact-list">' +
        '<li class="fact"><strong class="fact__num">수만 개</strong><span class="fact__body">카카오톡에 열려 있는 오픈채팅방. 많은 게 문제가 아니라, 나에게 맞는 방을 고를 방법이 없다는 게 문제입니다.</span></li>' +
        '<li class="fact"><strong class="fact__num">첫 한마디</strong><span class="fact__body">모임에서 가장 어려운 순간입니다. 공통 관심사가 하나라도 있으면 그 한마디를 꺼내기가 훨씬 쉬워집니다.</span></li>' +
        '<li class="fact"><strong class="fact__num">나가도 됨</strong><span class="fact__body">들어가 보고 안 맞으면 조용히 나오면 됩니다. 동네방네는 그걸 정상적인 사용법으로 봅니다.</span></li>' +
      '</ul>' +
    '</section>' +

    '<section class="why">' +
      '<h2 class="section-title">지금 수록된 것</h2>' +
      '<ul class="fact-list">' +
        '<li class="fact"><strong class="fact__num">' + chatCount + '개</strong><span class="fact__body">오픈채팅방 (모두 예시). 관심사 ' + interestCount + '종류, 분위기 3종류로 정리해 두었습니다.</span></li>' +
        '<li class="fact"><strong class="fact__num">' + regionCount + '곳</strong><span class="fact__body">지역 구분. 다른 지역의 오프라인 모임은 아예 보여주지 않습니다. 나갈 수 없는 모임을 추천하는 것은 도움이 아니기 때문입니다.</span></li>' +
        '<li class="fact"><strong class="fact__num">0개</strong><span class="fact__body">어딘가로 전송되는 답변. 이 파일은 인터넷에 연결하지 않고 혼자 돌아갑니다.</span></li>' +
      '</ul>' +
    '</section>' +

    '<section class="scope">' +
      '<h2 class="section-title">동네방네가 하는 일과 하지 않는 일</h2>' +
      '<div class="scope__grid">' +
        '<div class="scope__col"><p class="scope__head scope__head--do">합니다</p><ul class="scope__list">' +
          '<li>지역·관심사에 맞는 방만 골라 보여주기</li><li>왜 추천했는지 이유 밝히기</li><li>카카오톡 검색어 알려주기</li><li>조용한 방·구경만 하는 방도 함께 안내</li>' +
        '</ul></div>' +
        '<div class="scope__col"><p class="scope__head scope__head--dont">하지 않습니다</p><ul class="scope__list">' +
          '<li>방을 직접 운영하거나 중개</li><li>사람 소개·1:1 연결</li><li>개인정보 수집·저장</li><li>방 안에서 일어나는 일에 대한 책임</li>' +
        '</ul></div>' +
      '</div>' +
    '</section>' +

    '<section class="safety">' +
      '<h2 class="section-title">들어가기 전에 꼭 읽어 주세요</h2>' +
      '<ul class="safety__list">' +
        '<li><strong>돈을 요구하면 바로 나오세요.</strong> 투자·코인·부업 이야기를 꺼내는 방은 대부분 사기입니다.</li>' +
        '<li><strong>이름·직장·집 주소는 알려주지 마세요.</strong> 오픈채팅은 익명으로 쓸 수 있게 만들어진 곳입니다.</li>' +
        '<li><strong>1:1 대화를 자꾸 걸면 거절해도 됩니다.</strong> 거절이 무례한 게 아닙니다.</li>' +
        '<li><strong>불편하면 조용히 나와도 됩니다.</strong> 인사하고 나갈 의무는 없습니다.</li>' +
      '</ul>' +
    '</section>' +

    '<div class="cta"><button type="button" class="btn btn--primary btn--block" data-start>설문 시작하기</button></div>';
}

/* --- 설문 화면 ---------------------------------------------------------- */

function renderSurvey() {
  var q = QUESTIONS[state.step];
  var total = QUESTIONS.length;
  var progress = Math.round((state.step / total) * 100);
  var picked = state.answers[q.id] || [];
  var maxPick = q.maxPick || 99;
  var full = q.multi === true && picked.length >= maxPick;

  var html =
    '<div class="quiz">' +
      '<div class="quiz__progress">' +
        '<div class="quiz__progress-head"><span>질문 ' + (state.step + 1) + ' / ' + total + '</span><span>' + progress + '% 완료</span></div>' +
        '<div class="quiz__bar" role="progressbar" aria-valuenow="' + (state.step + 1) + '" aria-valuemin="1" aria-valuemax="' + total + '" aria-label="설문 진행률">' +
          '<div class="quiz__bar-fill" style="width:' + progress + '%"></div>' +
        '</div>' +
      '</div>' +
      '<div class="quiz__card card">' +
        '<h1 class="quiz__title">' + esc(q.title) + '</h1>' +
        '<p class="quiz__why">' + esc(q.why) + '</p>';

  if (q.multi) {
    html += '<p class="quiz__multi-hint">여러 개 고를 수 있습니다 · 최대 ' + maxPick + '개' +
      (picked.length > 0 ? ' · 지금 ' + picked.length + '개' : '') + '</p>';
  }

  html += '<ul class="quiz__choices">';
  for (var i = 0; i < q.choices.length; i++) {
    var c = q.choices[i];
    var on = picked.indexOf(c.id) !== -1;
    var blocked = !on && full;
    html +=
      '<li><button type="button" class="choice' + (on ? ' choice--on' : '') + '"' +
        (q.multi ? ' aria-pressed="' + (on ? 'true' : 'false') + '"' : '') +
        (blocked ? ' disabled' : '') +
        ' data-choice="' + esc(c.id) + '">' +
        '<span class="choice__label">' +
          (q.multi ? '<span class="choice__mark" aria-hidden="true">' + (on ? '✓' : '') + '</span>' : '') +
          esc(c.label) +
        '</span>' +
        (c.hint ? '<span class="choice__hint">' + esc(c.hint) + '</span>' : '') +
      '</button></li>';
  }
  html += '</ul>';

  if (q.multi) {
    html += '<div class="quiz__actions"><button type="button" class="btn btn--primary btn--block" data-next>' +
      (picked.length > 0 ? picked.length + '개 골랐어요 · 다음' : '고르지 않고 넘어가기') +
      '</button></div>';
  }

  html += '</div>' + // quiz__card
      '<div class="quiz__nav">' +
        (state.step > 0
          ? '<button type="button" class="btn btn--ghost" data-back>← 이전 질문</button>'
          : '<button type="button" class="btn btn--ghost" data-home>← 처음으로</button>') +
        '<p class="quiz__hint">' +
          (q.multi ? '고른 뒤 아래 버튼을 눌러주세요.' : '보기를 누르면 다음으로 넘어갑니다.') +
        '</p>' +
      '</div>' +
      '<p class="notice" style="margin-top:20px">답변한 내용은 이 파일 안에서만 계산되며 어디에도 전송되지 않습니다. 이름·연락처·카카오톡 아이디는 묻지 않습니다.</p>' +
    '</div>';

  surveyEl.innerHTML = html;
}

/** 다음 문항으로 가거나, 마지막이면 결과를 보여줍니다 */
function goNext() {
  if (state.step === QUESTIONS.length - 1) {
    renderResult();
    show("result");
  } else {
    state.step += 1;
    renderSurvey();
    window.scrollTo(0, 0);
  }
}

function choose(choiceId) {
  var q = QUESTIONS[state.step];
  var picked = state.answers[q.id] || [];

  if (q.multi) {
    var at = picked.indexOf(choiceId);
    var maxPick = q.maxPick || 99;
    if (at === -1 && picked.length >= maxPick) return; // 최대 개수를 넘기면 무시
    if (at === -1) picked = picked.concat([choiceId]);
    else picked = picked.slice(0, at).concat(picked.slice(at + 1));
    state.answers[q.id] = picked;
    renderSurvey();
    return;
  }

  state.answers[q.id] = [choiceId];
  goNext();
}

/* --- 결과 화면 ---------------------------------------------------------- */

function renderResult() {
  var results = matchChats(state.answers);

  var picks = [];
  for (var i = 0; i < QUESTIONS.length; i++) {
    var ids = state.answers[QUESTIONS[i].id] || [];
    for (var j = 0; j < ids.length; j++) {
      picks.push(choiceLabel(QUESTIONS[i].id, ids[j]));
    }
  }

  var noInterest = !state.answers["interest"] || state.answers["interest"].length === 0;

  var html =
    '<header class="result-head">' +
      '<p class="result-head__eyebrow">동네방네 추천 결과</p>' +
      '<h1 class="result-head__title">' +
        (results.length > 0
          ? '맞을 것 같은 방이<br><strong>' + results.length + '개</strong> 있습니다.'
          : '맞는 방을 찾지 못했습니다.') +
      '</h1>';

  if (results.length > 0) {
    html += '<p class="result-head__sum">위에 있는 방일수록 답변과 겹치는 부분이 많습니다.' +
      '<span>들어가 보고 안 맞으면 나와도 됩니다. 그게 정상적인 사용법입니다.</span></p>';
  }

  if (picks.length > 0) {
    html += '<ul class="chips" aria-label="내가 고른 답변">';
    for (var p = 0; p < picks.length; p++) html += '<li class="chip">' + esc(picks[p]) + '</li>';
    html += '</ul>';
  }

  html += '<div class="result-head__actions">' +
      '<button type="button" class="btn btn--ghost" data-restart>다시 설문하기</button>' +
      '<button type="button" class="btn btn--ghost" data-home>처음으로</button>' +
    '</div></header>';

  if (noInterest) {
    html += '<p class="notice" style="margin-bottom:18px">관심사를 고르지 않으셨습니다. 하나라도 고르시면 훨씬 정확해집니다.</p>';
  }

  if (results.length > 0) {
    html += '<ul class="chat-list">';
    for (var k = 0; k < results.length; k++) html += chatCardHtml(results[k]);
    html += '</ul>';
  } else {
    html += '<div class="card" style="padding:24px">' +
      '<p style="margin-bottom:12px">지금 수록된 방 중에는 조건에 맞는 것이 없었습니다. 아직 예시 방 몇 개뿐이라서 그렇습니다. <strong>맞는 모임이 없다는 뜻은 아닙니다.</strong></p>' +
      '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn--primary" data-restart>다시 설문하기</button>' +
        '<button type="button" class="btn" data-home>처음으로</button>' +
      '</div></div>';
  }

  html += '<p class="notice notice--warn" style="margin-top:24px">수록된 방은 <strong>모두 예시</strong>이며 실제로 있는 방이 아닙니다. 그래서 입장 링크 대신 검색어를 드립니다. 또한 동네방네는 방을 운영하지 않으며, 방 안에서 일어나는 일에 대해 책임지지 않습니다. <strong>돈을 요구하거나 개인정보를 묻는 방은 바로 나오세요.</strong></p>';

  resultEl.innerHTML = html;
}

function chatCardHtml(match) {
  var chat = match.chat;
  var level = matchLevel(match.score);

  var html = '<li class="chatcard card">' +
    '<div class="chatcard__top">' +
      '<span class="badge badge--' + level.tone + '">' + level.label + '</span>' +
      (chat.source === "example"
        ? '<span class="badge badge--warn">예시 방</span>'
        : '<span class="badge badge--success">확인된 방</span>') +
      '<span class="chatcard__members">' + esc(chat.memberLabel) + '</span>' +
    '</div>' +
    '<h3 class="chatcard__name">' + esc(chat.name) + '</h3>' +
    '<p class="chatcard__summary">' + esc(chat.summary) + '</p>' +
    '<p class="chatcard__plain">' + esc(chat.plain) + '</p>';

  if (match.reasons.length > 0) {
    html += '<div class="chatcard__reasons"><span class="chatcard__reasons-label">이유</span><ul class="chips">';
    for (var i = 0; i < match.reasons.length; i++) {
      html += '<li class="chip chip--reason">' + esc(match.reasons[i]) + '</li>';
    }
    html += '</ul></div>';
  }

  html += '<div class="chatcard__foot">';
  if (chat.url) {
    html += '<a class="btn btn--primary" href="' + esc(chat.url) + '" target="_blank" rel="noopener noreferrer">카카오톡으로 열기</a>';
  } else {
    html += '<button type="button" class="btn btn--primary" data-copy="' + esc(chat.searchKeyword) + '">검색어 복사</button>' +
      '<code class="chatcard__keyword">' + esc(chat.searchKeyword) + '</code>';
  }
  html += '</div>';

  if (!chat.url) {
    html += '<p class="chatcard__howto">카카오톡 → 오픈채팅 → 검색창에 붙여넣으면 비슷한 방을 찾을 수 있습니다.</p>';
  }

  return html + '</li>';
}

/**
 * 검색어 복사.
 * 파일을 직접 열었을 때(file://) 최신 복사 기능이 막히는 브라우저가 있어서,
 * 실패하면 옛 방식으로 한 번 더 시도합니다.
 */
function copyText(text, button) {
  function done() {
    var before = button.textContent;
    button.textContent = "✓ 복사했습니다";
    setTimeout(function () { button.textContent = before; }, 2500);
  }
  function fallback() {
    var box = document.createElement("textarea");
    box.value = text;
    box.setAttribute("readonly", "");
    box.style.position = "fixed";
    box.style.left = "-9999px";
    document.body.appendChild(box);
    box.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(box);
    if (ok) { done(); return; }
    var warn = document.createElement("p");
    warn.className = "chatcard__fail";
    warn.textContent = "복사에 실패했습니다. 위 검색어를 직접 입력해 주세요.";
    button.parentNode.appendChild(warn);
    setTimeout(function () { if (warn.parentNode) warn.parentNode.removeChild(warn); }, 3500);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

/* --- 버튼 연결 ---------------------------------------------------------- */

document.addEventListener("click", function (event) {
  var target = event.target.closest ? event.target.closest("button, a") : null;
  if (!target) return;

  if (target.hasAttribute("data-start")) {
    state = { step: 0, answers: {} };
    renderSurvey();
    show("survey");
  } else if (target.hasAttribute("data-choice")) {
    choose(target.getAttribute("data-choice"));
  } else if (target.hasAttribute("data-next")) {
    goNext();
  } else if (target.hasAttribute("data-back")) {
    if (state.step > 0) { state.step -= 1; renderSurvey(); window.scrollTo(0, 0); }
  } else if (target.hasAttribute("data-home")) {
    show("home");
  } else if (target.hasAttribute("data-restart")) {
    state = { step: 0, answers: {} };
    renderSurvey();
    show("survey");
  } else if (target.hasAttribute("data-copy")) {
    copyText(target.getAttribute("data-copy"), target);
  }
});

/* 상단 로고 → 처음으로 */
document.getElementById("brandBtn").addEventListener("click", function () {
  show("home");
});

/* 글자 크게 보기 */
var textSizeBtn = document.getElementById("textSizeBtn");
var large = false;
try {
  large = window.localStorage.getItem("dongne:textsize") === "large";
} catch (e) { large = false; }

function applyTextSize() {
  if (large) document.documentElement.setAttribute("data-textsize", "large");
  else document.documentElement.removeAttribute("data-textsize");
  textSizeBtn.setAttribute("aria-pressed", large ? "true" : "false");
  textSizeBtn.querySelector(".textsize-toggle__label").textContent = large ? "글자 작게" : "글자 크게";
  try {
    window.localStorage.setItem("dongne:textsize", large ? "large" : "normal");
  } catch (e) { /* 파일로 열면 저장이 막힐 수 있습니다. 무시해도 됩니다. */ }
}

textSizeBtn.addEventListener("click", function () {
  large = !large;
  applyTextSize();
});

/* 시작 */
renderHome();
applyTextSize();
show("home");
</script>
